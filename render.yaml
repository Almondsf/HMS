# Render Blueprint: one Docker service running the API and the web app,
# plus an hourly cron job for SMS appointment reminders.
# https://render.com/docs/blueprint-spec
#
# Deliberately does NOT create a database: point DATABASE_URL at your
# existing Postgres (Render dashboard -> your database -> Internal URL).
# For a brand-new install, create a Postgres instance first.
#
# After the first deploy, add custom domains to this service:
#   yourdomain.com     (the platform site; also list it in PLATFORM_DOMAINS)
#   *.yourdomain.com   (every hospital, e.g. stlukes.yourdomain.com)
# and point DNS for both at Render as the dashboard instructs.

services:
  - type: web
    name: hms
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    # Runs before each new version goes live; migrates every hospital's schema
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_platform && python manage.py process_signups
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hms.settings.prod
      - key: DATABASE_URL
        sync: false # paste your Postgres internal URL
      - key: SECRET_KEY
        generateValue: true
      - key: TENANT_BASE_DOMAIN
        sync: false # e.g. yourdomain.com -> hospitals at <name>.yourdomain.com
      - key: PLATFORM_DOMAINS
        sync: false # e.g. yourdomain.com (Render's own hostname is added automatically)
      - key: PRODUCT_NAME
        sync: false # your product's name, shown on the website and in emails (default HMS)
      - key: LOG_FORMAT
        value: json
      # Error monitoring (optional): create two Sentry projects, Django and React
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_FRONTEND_DSN
        sync: false
      # Password reset emails: any SMTP provider (Brevo, Mailgun, SES, Postmark...)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. "St Luke's HMS <no-reply@yourdomain.com>"
      # Subscriptions: Paystack secret key (sk_live_...). Then set the webhook URL in Paystack
      # to https://<platform domain>/api/v1/platform/billing/paystack/webhook/
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Patient SMS (optional): termii or africastalking, with the provider's API key.
      # Sender IDs must be registered with the provider. See helpers/sms.py.
      - key: SMS_BACKEND
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false # Africa's Talking only
      - key: SMS_SENDER_ID
        sync: false

  # Appointment reminders: hourly; each hospital's reminders go out once its morning
  # reaches SMS_REMINDER_HOUR. Only needed once SMS is set up. Settings come from the web service.
  - type: cron
    name: hms-reminders
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 * * * *"
    dockerCommand: python manage.py send_appointment_reminders
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hms.settings.prod
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        fromService: { type: web, name: hms, envVarKey: DATABASE_URL }
      - key: SECRET_KEY
        fromService: { type: web, name: hms, envVarKey: SECRET_KEY }
      - key: TENANT_BASE_DOMAIN
        fromService: { type: web, name: hms, envVarKey: TENANT_BASE_DOMAIN }
      - key: PLATFORM_DOMAINS
        fromService: { type: web, name: hms, envVarKey: PLATFORM_DOMAINS }
      - key: PRODUCT_NAME
        fromService: { type: web, name: hms, envVarKey: PRODUCT_NAME }
      - key: SENTRY_DSN
        fromService: { type: web, name: hms, envVarKey: SENTRY_DSN }
      - key: SMS_BACKEND
        fromService: { type: web, name: hms, envVarKey: SMS_BACKEND }
      - key: SMS_API_KEY
        fromService: { type: web, name: hms, envVarKey: SMS_API_KEY }
      - key: SMS_USERNAME
        fromService: { type: web, name: hms, envVarKey: SMS_USERNAME }
      - key: SMS_SENDER_ID
        fromService: { type: web, name: hms, envVarKey: SMS_SENDER_ID }
