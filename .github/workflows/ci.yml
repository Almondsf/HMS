name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install ruff==0.17.0
      - name: Lint (style, bugs, security)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hms:hms@localhost:5432/hms
      DJANGO_SETTINGS_MODULE: hms.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov --cov-report=term --cov-fail-under=85

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production image builds (web app + API)
        run: docker build -t hms:ci .
      - name: Container boots and answers health checks
        run: |
          docker run -d --name hms -p 8000:8000 \
            -e SECRET_KEY=ci-only-0123456789abcdefghijklmnopqrstuvwxyz0123456789 \
            -e PLATFORM_DOMAINS=localhost -e TENANT_BASE_DOMAIN=example.test \
            -e DATABASE_URL=postgres://nobody:nothing@127.0.0.1:5432/none \
            hms:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health/ || true)
            # 503 is expected here (no database); it proves the app booted and serves requests
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then echo "health: $code"; exit 0; fi
            sleep 2
          done
          docker logs hms; exit 1
      - name: Web app is inside the image
        run: docker run --rm --entrypoint sh hms:ci -c 'test -f frontend/dist/index.html && ls frontend/dist/assets | head -3'
